# ==============================================================================
# PostgreSQL 16 Hardened Loopback Configuration — TRILUNAIR v1.2
# Dedicated Solely to trilunair.medinsup.com (NEVER shared with medinsup.com)
# Copy to: /etc/postgresql/16/main/conf.d/99-trilunair-hardening.conf
# ==============================================================================

# Bind strictly to loopback; PostgreSQL is NEVER exposed to public or VPC interfaces
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 40

# Cryptographic password hashing
password_encryption = scram-sha-256

# Durability & low-latency tuned for 2 GB - 12 GB SSD Cloud VM
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_level = replica
synchronous_commit = on
fsync = on
full_page_writes = on
checkpoint_completion_target = 0.9
random_page_cost = 1.1

# Audit & slow query visibility (never log bind secrets)
log_connections = on
log_disconnections = on
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %u@%d '
