name: Deploy TRILMAJED & Trilliurin Cloud Cockpit

on:
  push:
    branches:
      - main
      - release/binance-personal-v1.3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify-quant-engine:
    name: Verify Quant Core & Argon2id Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt argon2-cffi pytest httpx
      - name: Run Quant Core self-test & unit tests
        working-directory: backend
        run: |
          python app/quant_core.py
          pytest tests/test_quant_core.py tests/test_admin_mfa_totp.py -q

  deploy-pages:
    name: Publish Cloud Cockpit to GitHub Pages
    needs: verify-quant-engine
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Cloud Static Bundle (PAPER-Locked)
        run: |
          mkdir -p _cloud_dist
          cp standalone-preview.html _cloud_dist/index.html
          cp mobile-cockpit.html _cloud_dist/mobile.html
          if [ -f frontend/public/_headers ]; then
            cp frontend/public/_headers _cloud_dist/_headers
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _cloud_dist
      - id: deployment
        uses: actions/deploy-pages@v4
