# ==============================================================================
# تكوين Docker Compose المصلّب للتشغيل المحلي والخوادم (PostgreSQL 16 + Redis 7 + FastAPI/React SPA)
# My Road to be Trilunair Dr.MaJoOoOoOoD — الإصدار v1.1.0-cloud-paper
# القفل الدائم: وضع التنفيذ الورقي PAPER حصراً (liveAuthorized=false)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: trilunair-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trilunair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trilunair}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trilunair_pg_data:/var/lib/postgresql/data
    networks:
      - trilunair_internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trilunair} -d ${POSTGRES_DB:-trilunair}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trilunair-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - trilunair_redis_data:/data
    networks:
      - trilunair_internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  trilunair-command-center:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trilunair-command-center
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TRILUNAIR_ENV=${TRILUNAIR_ENV:-production}
      - TRILUNAIR_DEFAULT_MODE=PAPER
      - TRILUNAIR_ADMIN_SECRET_HASH=${TRILUNAIR_ADMIN_SECRET_HASH:?Set TRILUNAIR_ADMIN_SECRET_HASH in .env}
      - TRILUNAIR_SESSION_SECRET=${TRILUNAIR_SESSION_SECRET:?Set TRILUNAIR_SESSION_SECRET in .env}
      - TRILUNAIR_ALLOWED_ORIGINS=${TRILUNAIR_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trilunair}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trilunair}
      - REDIS_URL=redis://redis:6379/0
      - TRILUNAIR_DB_PATH=/app/backend/data/trilunair.db
      - TRILUNAIR_MARKET_DATA_MODE=${TRILUNAIR_MARKET_DATA_MODE:-LIVE_PUBLIC}
      - BINANCE_SPOT_PUBLIC_REST_URL=${BINANCE_SPOT_PUBLIC_REST_URL:-https://data-api.binance.vision}
      - BINANCE_SPOT_PUBLIC_WS_URL=${BINANCE_SPOT_PUBLIC_WS_URL:-wss://data-stream.binance.vision/stream}
      - TRILUNAIR_PROPOSAL_TTL_SECONDS=${TRILUNAIR_PROPOSAL_TTL_SECONDS:-180}
      - TRILUNAIR_MARKET_STALE_SECONDS=${TRILUNAIR_MARKET_STALE_SECONDS:-15}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-3-mini}
    volumes:
      - trilunair_sqlite_data:/app/backend/data
    networks:
      - trilunair_internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  trilunair_internal:
    driver: bridge

volumes:
  trilunair_pg_data:
  trilunair_redis_data:
  trilunair_sqlite_data:
