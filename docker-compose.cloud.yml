# ==============================================================================
# تكوين النشر السحابي الكامل مع وكيل عكسي HTTPS + WSS تلقائي (Caddy 2 + TLS 1.3)
# الاستخدام:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up --build -d
# يتيح الوصول الآمن من متصفح Safari على macOS و iOS عبر https:// و wss://
# ==============================================================================

services:
  caddy-reverse-proxy:
    image: caddy:2-alpine
    container_name: trilunair-caddy-tls
    depends_on:
      trilunair-command-center:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - TRILUNAIR_CLOUD_DOMAIN=${TRILUNAIR_CLOUD_DOMAIN:?Set TRILUNAIR_CLOUD_DOMAIN in .env}
      - TRILUNAIR_TLS_EMAIL=${TRILUNAIR_TLS_EMAIL:?Set TRILUNAIR_TLS_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - trilunair_caddy_data:/data
      - trilunair_caddy_config:/config
    networks:
      - trilunair_internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  trilunair_caddy_data:
  trilunair_caddy_config:
